version: '3.8'

services:
  relic_ai:
    build:
      context: ../RELIC-project
      dockerfile: Dockerfile
    container_name: relic_engine
    ports:
      - "8080:8080"
    volumes:
      - ../RELIC-project/resultados:/app/resultados
    environment:
      - PORT=8080
      - MODEL_PATH=/app/resultados/relic_core.relic
      - TOKENIZER_PATH=/app/resultados/tokenizer.bin
    restart: unless-stopped

  agentic_gateway:
    build:
      context: ./agentic_gateway
      dockerfile: Dockerfile
    container_name: agentic_gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - RELIC_SERVER_URL=http://relic_ai:8080
    depends_on:
      - relic_ai
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: relic_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_GATEWAY_URL=http://localhost:3000
    depends_on:
      - agentic_gateway
    restart: unless-stopped
